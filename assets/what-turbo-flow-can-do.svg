<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1400" width="1400" height="1400" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">
  <title>What Turbo Flow can do — right now</title>
  <defs><linearGradient id="scan" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4dd6c1" stop-opacity="0"/><stop offset=".5" stop-color="#4dd6c1" stop-opacity=".05"/><stop offset="1" stop-color="#4dd6c1" stop-opacity="0"/></linearGradient><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7d8ba1"/></marker></defs>
