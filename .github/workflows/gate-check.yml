name: gate-verdict

# Turns the gate's verdict into a required status check.
# With branch protection requiring this check, GitHub itself blocks
# merges until the gate has posted APPROVED — no agent can bypass it.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: read
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check for gate APPROVED verdict
        uses: actions/github-script@v7
        with:
          script: |
            // Fetch ALL PR comments, find gate verdicts, take the LATEST
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });

            const verdicts = [];
            for (const c of comments.data) {
              // The gate's verdict line: "VERDICT: APPROVED" or "VERDICT· REVISE"
              const m = c.body.match(/VERDICT[·:]?\s*(APPROVED|REVISE)/);
              if (m) {
                verdicts.push({
                  verdict: m[1],
                  author: c.user.login,
                  createdAt: c.created_at,
                  body: c.body.substring(0, 100),
                });
              }
            }

            if (verdicts.length === 0) {
              core.setFailed('No gate verdict found — run rig-lite/gate.sh --pr ' + context.issue.number + ' and merge is blocked until APPROVED.');
              return;
            }

            const latest = verdicts[verdicts.length - 1];
            console.log(`Latest verdict: ${latest.verdict} by @${latest.author} at ${latest.createdAt}`);
            console.log(`Total gate verdicts on this PR: ${verdicts.length}`);

            if (latest.verdict !== 'APPROVED') {
              core.setFailed(`Gate verdict: ${latest.verdict} — fix the findings and re-gate. Merge is blocked until APPROVED.`);
              return;
            }

            console.log('✓ Gate APPROVED — merge is allowed (by a human).');
